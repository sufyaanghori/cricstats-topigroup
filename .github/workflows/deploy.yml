name: Generate Stats & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # allows manual trigger from GitHub UI

permissions:
  contents: write           # needed to push data/stats.json back
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install Python deps
        run: pip install pandas openpyxl

      # 4. Run the converter — produces data/stats.json
      - name: Generate stats.json
        run: python generate_stats.py

      # 5. Commit stats.json so it's served by Pages
      - name: Commit generated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git diff --cached --quiet || git commit -m "chore: refresh stats.json [skip ci]"
          git push

      # 6. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: ".github,generate_stats.py,README.md,*.xlsx"
